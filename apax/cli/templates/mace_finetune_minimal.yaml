# Minimal fine-tune config for a converted MACE foundation model.
#
# Prerequisites:
#   uv sync --extra mace
#   uv run apax convert-mace small ./mace-mp-0-small.apax
#
# Then:
#   uv run apax train mace_finetune_minimal.yaml
#
# This template keeps the foundation's per-layer MaceReadout and adds a
# shallow ensemble on top so the MaceReadout's final NonLinearReadoutBlock
# emits n_members scalar channels rather than 1 — the standard apax
# uncertainty mechanism with no MACE-specific trainer code.
#
# Swapping the head for a fresh AtomisticReadout MLP (set readout.kind: standard,
# nn: [256, 256]) is the natural extension but is currently blocked by an
# upstream apax limitation: ``black_list_param_transfer`` writes every source
# key into the target params pytree, so the foundation's MaceReadout params
# leak in and break ``optax.masked``. Until that's fixed, keep readout.kind:
# mace below.

n_epochs: 50
seed: 1

data:
  directory: ./runs/
  experiment: mace_finetune
  data_path: ./dataset.extxyz
  n_train: 800
  n_valid: 100
  batch_size: 16
  valid_batch_size: 32

model:
  name: mace
  basis:
    name: bessel
    variant: standard
    n_basis: 10
    r_max: 6.0
  radial_embedding:
    num_polynomial_cutoff: 5
  descriptor:
    max_ell: 3
    hidden_irreps: 128x0e
    correlation: 3
    interactions:
      - name: RealAgnosticResidual
      - name: RealAgnosticResidual
    avg_num_neighbors: 1.0
    use_cueq: false
  readout:
    kind: mace
    MLP_irreps: 16x0e
  ensemble:
    kind: shallow
    n_members: 8
    force_variance: true

transfer_learning:
  base_model_checkpoint: ./mace-mp-0-small.apax
  reset_layers: []

loss:
  - { name: energy, loss_type: crps }
  - { name: forces, loss_type: crps }

optimizer:
  name: adam
  nn_lr: 0.0003
  emb_lr: 0.0003
  scale_lr: 0.0001
  shift_lr: 0.0003
